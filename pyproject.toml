[project]
name = "volcamp"
version = "0.1.0"
description = "deepagents + OpenSandbox workshop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.14",
    "duckdb>=1.5.6",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain[mcp]>=1.4.0",
    "mcp>=2.2.0",
    "opensandbox>=0.1.16",
    "rich>=13",
]

# Makes `volcamp/` (the pretty-printer) importable from exercices/ and solutions/:
# uv installs the project in editable mode on `uv sync` / `uv run`.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
